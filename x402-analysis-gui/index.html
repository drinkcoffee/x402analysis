<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>x402 Analysis</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --ink: #1a1d24;
      --muted: #5b6270;
      --accent: #2f5fe0;
      --accent-ink: #ffffff;
      --panel: #ffffff;
      --border: #dde1e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --ink: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #5b8bff;
        --accent-ink: #0b0e14;
        --panel: #171b23;
        --border: #262c38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }
    main {
      width: 100%;
      max-width: 460px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3rem 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }
    p.subtitle {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    a.login-button {
      display: inline-block;
      padding: 0.7rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-ink);
    }
    a.login-button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>x402 Analysis</h1>
    <p class="subtitle">Tools for the x402 payment protocol ecosystem.</p>
    <a class="login-button" href="/auth/login">Log in</a>
  </main>
</body>
</html>
